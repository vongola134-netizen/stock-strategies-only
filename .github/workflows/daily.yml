name: V3 Daily Signal

on:
  # Scheduled trigger disabled: FinMind returns "Token is illegal" for
  # TAIEX index / futures data specifically when called from GitHub
  # Actions' cloud IPs (individual stock data is unaffected). Running
  # locally via Windows Task Scheduler instead. workflow_dispatch kept
  # for manual testing.
  workflow_dispatch:

jobs:
  run-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install deps
        run: uv sync

      - name: Cache FinMind data
        uses: actions/cache@v4
        with:
          path: .cache/finmind
          key: finmind-${{ github.run_id }}
          restore-keys: |
            finmind-

      - name: Run signal engine
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: uv run python main.py

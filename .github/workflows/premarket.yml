name: Premarket Night Session

on:
  # 排程觸發已停用：FinMind 對 GitHub Actions 雲端 IP 抓「台指期夜盤」資料
  # 回傳 "Token is illegal"（個股資料不受影響），而這支腳本整個功能都靠
  # 夜盤資料，改成本機 Windows 工作排程器執行。保留 workflow_dispatch 供手動測試。
  workflow_dispatch:  # 允許手動觸發測試

jobs:
  run-premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: uv sync

      - name: Cache FinMind data
        uses: actions/cache@v4
        with:
          path: .cache/finmind
          key: finmind-${{ github.run_id }}
          restore-keys: |
            finmind-

      - name: Run premarket report
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: uv run python premarket.py
